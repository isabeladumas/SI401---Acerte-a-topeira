<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Acerte os zumbis - Login</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="pagina">

        <section class="login">

            <div >
                <img class="planta" src="Imgs/logo.png">
            </div>

            <h1>Pensar nome</h1>

            <p class="subtitulo">Acerte os zumbis</p>

            <form>

                <div class="campo">
                    <label for="usuario">USERNAME</label>
                    <input type="text" id="usuario" name="usuario"
                        placeholder="JOGADOR 1">
                </div>

                <div class="campo">
                    <label for="senha">SENHA</label>
                    <input type="password" id="senha" name="senha"
                        placeholder="***********">
                </div>

                <button type="submit"> COMEÇAR O JOGO</button>

            </form>

            <a class="cadastro" href="cadastro.html"> Ainda não tenho cadastro </a>

        </section>

    </main>

</body>

</html>
