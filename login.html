<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Zumbee - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="pagina-auth">
        <section class="cartao cartao--login">
            <img class="planta" src="Imgs/vaso.png">

            <h1 class="titulo">Zumbee</h1>

            <p class="subtitulo">Acerte os zumbis</p>

            <form class="formulario">
                <div class="campo">
                    <label for="usuario">Username</label>
                    <input type="text" id="usuario" name="usuario" placeholder="JOGADOR 1">
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="***********">
                </div>

                <button type="submit" class="botao"> COMEÇAR O JOGO</button>
            </form>
            <a class="link-auxiliar" href="cadastro.html"> Ainda não tenho cadastro</a>
        </section>

    </main>

</body>

</html>
